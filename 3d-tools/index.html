<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3Dwork – 3D Creation Tools</title>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script src="https://unpkg.com/i18next@23.8.2/dist/umd/i18next.min.js"></script>
    <script src="https://unpkg.com/react-i18next@14.0.5/dist/umd/react-i18next.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <link rel="stylesheet" href="css/app.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        header {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 1rem 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        #top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            transition: transform 0.3s ease;
        }

        .logo-img {
            height: 42px;
            width: auto;
            object-fit: contain;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 1rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.4rem;
            border-radius: 100px;
            align-items: center;
        }

        .nav-links a {
            color: #94A3B8;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            padding: 0.6rem 1.2rem;
            border-radius: 100px;
            transition: all 0.4s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: white;
            background: rgba(255, 255, 255, 0.1);
        }

        .dropdown {
            position: relative;
        }

        .dropdown-trigger {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(8px);
            background: rgba(15, 23, 42, 0.98);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 0.5rem;
            min-width: 200px;
            display: none;
            list-style: none;
            z-index: 1001;
        }

        .dropdown:hover .dropdown-menu {
            display: block;
        }

        .dropdown-menu a {
            display: block;
            padding: 0.6rem 1rem;
            font-size: 0.85rem;
            border-radius: 8px;
            text-align: left;
        }

        .palette-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(28px, 1fr));
            gap: 4px;
            margin-top: 8px;
        }

        .palette-swatch {
            aspect-ratio: 1;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .dimension-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            position: relative;
        }

        .aspect-lock {
            position: absolute;
            left: 50%;
            top: 60%;
            transform: translate(-50%, -50%);
            z-index: 5;
            background: #0F172A;
            border: 1px solid var(--border);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            cursor: pointer;
        }

        .aspect-lock.active {
            border-color: var(--accent);
            color: var(--accent);
        }

        .view-btns {
            position: absolute;
            bottom: 10px;
            right: 10px;
            display: flex;
            gap: 6px;
        }

        .v-btn {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            color: #94A3B8;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            cursor: pointer;
        }

        .v-btn:hover {
            color: white;
            border-color: var(--accent);
        }

        .f-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1E293B;
            border: 1px solid var(--border);
            padding: 6px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 6px;
        }

        .f-item:hover {
            border-color: var(--accent);
        }

        .f-col {
            width: 24px;
            height: 24px;
            border-radius: 4px;
        }

        .f-details {
            flex: 1;
            font-size: 11px;
        }

        .f-td {
            font-size: 10px;
            color: var(--accent);
            font-weight: 700;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useId, useCallback } = React;

        /**
         * ========================================================================
         * 1. 3D ENGINES (STL & SHADERS)
         * ========================================================================
         */
        const STLExporter = {
            download: (buf, name) => {
                const bl = new Blob([buf], { type: 'application/octet-stream' });
                const u = URL.createObjectURL(bl);
                const a = document.createElement('a'); a.href = u; a.download = name; a.click();
                setTimeout(() => URL.revokeObjectURL(u), 1000);
            },
            exportBinary: (geo) => {
                if (!geo) return null;
                const pos = geo.getAttribute('position'); const count = pos.count / 3;
                const b = new ArrayBuffer(84 + count * 50); const v = new DataView(b);
                const h = "3Dwork.io Export"; for (let i = 0; i < 80; i++) v.setUint8(i, i < h.length ? h.charCodeAt(i) : 0); v.setUint32(80, count, true);
                const vA = new THREE.Vector3(), vB = new THREE.Vector3(), vC = new THREE.Vector3(), cb = new THREE.Vector3(), ab = new THREE.Vector3();
                let off = 84;
                for (let i = 0; i < count; i++) {
                    vA.fromBufferAttribute(pos, i * 3); vB.fromBufferAttribute(pos, i * 3 + 1); vC.fromBufferAttribute(pos, i * 3 + 2);
                    cb.subVectors(vC, vB); ab.subVectors(vA, vB); cb.cross(ab).normalize();
                    v.setFloat32(off, cb.x, true); v.setFloat32(off + 4, cb.y, true); v.setFloat32(off + 8, cb.z, true);
                    v.setFloat32(off + 12, vA.x, true); v.setFloat32(off + 16, vA.y, true); v.setFloat32(off + 20, vA.z, true);
                    v.setFloat32(off + 24, vB.x, true); v.setFloat32(off + 28, vB.y, true); v.setFloat32(off + 32, vB.z, true);
                    v.setFloat32(off + 36, vC.x, true); v.setFloat32(off + 40, vC.y, true); v.setFloat32(off + 44, vC.z, true);
                    v.setUint16(off + 48, 0, true); off += 50;
                }
                return b;
            },
            buildLitho: (pix, imgW, imgH, S) => {
                const { width, height, baseT, maxT, bright, contrast, invert, geom, res, numColors, frameW, frameT, scaleMode } = S;
                const gW = res, gH = Math.round(res * (height / width));
                const grid = new Float32Array((gW + 1) * (gH + 1));
                const tRange = maxT - baseT;

                // Sampling Logic (Fitz/Crop)
                const outR = width / height, inR = imgW / imgH;
                let sW = imgW, sH = imgH, oX = 0, oY = 0;
                if (scaleMode === 'fill') {
                    if (inR > outR) { sW = imgH * outR; oX = (imgW - sW) / 2; }
                    else { sH = imgW / outR; oY = (imgH - sH) / 2; }
                }

                for (let r = 0; r <= gH; r++) {
                    for (let c = 0; c <= gW; c++) {
                        const px = Math.min(Math.floor(oX + (c / gW) * sW), imgW - 1), py = Math.min(Math.floor(oY + (r / gH) * sH), imgH - 1);
                        const idx = (py * imgW + px) * 4;
                        let g = (pix[idx] * 0.299 + pix[idx + 1] * 0.587 + pix[idx + 2] * 0.114) / 255;
                        g = Math.max(0, Math.min(1, (g - 0.5) * contrast + 0.5 + (bright - 0.5)));
                        if (invert) g = 1 - g;
                        if (numColors < 20) g = Math.round(g * (numColors - 1)) / (numColors - 1);
                        grid[r * (gW + 1) + c] = baseT + g * tRange;
                    }
                }

                const pos = [], col = [];
                const getP = (c, r, z) => {
                    let x = (c / gW - 0.5) * width, y = (0.5 - r / gH) * height;
                    if (geom === 'cylindrical') { const a = (c / gW - 0.5) * Math.PI, rd = width / Math.PI; return [Math.sin(a) * (rd + z), y, Math.cos(a) * (rd + z) - rd]; }
                    if (geom === 'curved') { const a = (c / gW - 0.5) * Math.PI * 0.5, rd = width / (Math.PI * 0.5); return [Math.sin(a) * (rd + z), y, Math.cos(a) * (rd + z) - rd]; }
                    return [x, y, z];
                };

                const pushTri = (a, b, c, z) => {
                    const vA = getP(a.c, a.r, a.z), vB = getP(b.c, b.r, b.z), vC = getP(c.c, c.r, c.z);
                    pos.push(...vA, ...vB, ...vC);
                    const level = (a.z + b.z + c.z) / 3 / maxT;
                    const gc = 0.4 + level * 0.6;
                    col.push(gc, gc, gc, gc, gc, gc, gc, gc, gc);
                };

                for (let r = 0; r < gH; r++) {
                    for (let c = 0; c < gW; c++) {
                        const z00 = grid[r * (gW + 1) + c], z10 = grid[r * (gW + 1) + c + 1], z01 = grid[(r + 1) * (gW + 1) + c], z11 = grid[(r + 1) * (gW + 1) + c + 1];
                        // Front
                        pushTri({ c, r, z: z00 }, { c: c + 1, r, z: z10 }, { c: c + 1, r: r + 1, z: z11 });
                        pushTri({ c, r, z: z00 }, { c: c + 1, r: r + 1, z: z11 }, { c, r: r + 1, z: z01 });
                        // Back
                        pushTri({ c, r, z: 0 }, { c: c + 1, r: r + 1, z: 0 }, { c: c + 1, r, z: 0 });
                        pushTri({ c, r, z: 0 }, { c, r: r + 1, z: 0 }, { c: c + 1, r: r + 1, z: 0 });
                    }
                }
                // Walls
                for (let r = 0; r < gH; r++) {
                    pushTri({ c: 0, r, z: grid[r * (gW + 1)] }, { c: 0, r: r + 1, z: 0 }, { c: 0, r, z: 0 }); pushTri({ c: 0, r, z: grid[r * (gW + 1)] }, { c: 0, r: r + 1, z: grid[(r + 1) * (gW + 1)] }, { c: 0, r: r + 1, z: 0 });
                    pushTri({ c: gW, r, z: grid[r * (gW + 1) + gW] }, { c: gW, r, z: 0 }, { c: gW, r: r + 1, z: 0 }); pushTri({ c: gW, r, z: grid[r * (gW + 1) + gW] }, { c: gW, r: r + 1, z: 0 }, { c: gW, r: r + 1, z: grid[(r + 1) * (gW + 1) + gW] });
                }
                for (let c = 0; c < gW; c++) {
                    pushTri({ c, r: 0, z: grid[c] }, { c, r: 0, z: 0 }, { c: c + 1, r: 0, z: 0 }); pushTri({ c, r: 0, z: grid[c] }, { c: c + 1, r: 0, z: 0 }, { c: c + 1, r: 0, z: grid[c + 1] });
                    pushTri({ c, r: gH, z: grid[gH * (gW + 1) + c] }, { c: c + 1, r: gH, z: 0 }, { c, r: gH, z: 0 }); pushTri({ c, r: gH, z: grid[gH * (gW + 1) + c] }, { c: c + 1, r: gH, z: grid[gH * (gW + 1) + c + 1] }, { c: c + 1, r: gH, z: 0 });
                }

                const geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos), 3));
                geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(col), 3));
                geo.computeVertexNormals(); return geo;
            }
        };

        /**
         * ========================================================================
         * 2. UI COMPONENTS & APP
         * ========================================================================
         */
        const Canvas3D = ({ onMount, hint, info, children }) => {
            const mount = useRef(null);
            const state = useRef({ theta: 45, phi: 65, radius: 200 });

            useEffect(() => {
                const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(mount.current.clientWidth, mount.current.clientHeight);
                r.outputColorSpace = THREE.SRGBColorSpace; mount.current.appendChild(r.domElement);
                const s = new THREE.Scene(); s.background = new THREE.Color(0x080E1A);
                const c = new THREE.PerspectiveCamera(45, mount.current.clientWidth / mount.current.clientHeight, 1, 1000);
                s.add(new THREE.AmbientLight(0xffffff, 0.4)); const pl = new THREE.PointLight(0xffffff, 1.5, 600); pl.position.set(100, 100, 100); s.add(pl);

                const update = () => {
                    const t = state.current.theta * (Math.PI / 180), p = Math.max(5, Math.min(175, state.current.phi)) * (Math.PI / 180);
                    c.position.set(state.current.radius * Math.sin(p) * Math.sin(t), state.current.radius * Math.cos(p), state.current.radius * Math.sin(p) * Math.cos(t));
                    c.lookAt(0, 0, 0);
                }; update();

                let drag = false, px, py;
                r.domElement.onmousedown = (e) => { drag = true; px = e.clientX; py = e.clientY; };
                window.onmouseup = () => drag = false;
                window.onmousemove = (e) => { if (drag) { state.current.theta -= (e.clientX - px) * 0.4; state.current.phi -= (e.clientY - py) * 0.4; px = e.clientX; py = e.clientY; update(); } };
                r.domElement.onwheel = (e) => { e.preventDefault(); state.current.radius = Math.max(40, Math.min(800, state.current.radius + e.deltaY * 0.4)); update(); };

                const anim = () => { state.current.id = requestAnimationFrame(anim); r.render(s, c); }; anim();
                if (onMount) onMount({ scene: s, reset: () => { state.current.theta = 45; state.current.phi = 65; state.current.radius = 200; update(); }, set: (t, p) => { state.current.theta = t; state.current.phi = p; update(); } });
                return () => { cancelAnimationFrame(state.current.id); r.dispose(); mount.current.removeChild(r.domElement); };
            }, []);

            return <div style={{ width: '100%', height: '100%', position: 'relative' }}>
                <div ref={mount} style={{ width: '100%', height: '100%' }} />
                {info && <div className="canvas-overlay" style={{ pointerEvents: 'none' }}><div className="canvas-info" dangerouslySetInnerHTML={{ __html: info }} /></div>}
                {hint && <div className="canvas-hint">{hint}</div>}
                {children}
            </div>;
        };

        const LithophaneTool = () => {
            useEffect(() => { document.title = 'Lithophane Creator – 3Dwork'; }, []);
            const [imgUrl, setImgUrl] = useState(null), [pix, setPix] = useState(null), [imgW, setImgW] = useState(0), [imgH, setImgH] = useState(0), [imgR, setImgR] = useState(1);
            const [W, setW] = useState(100), [H, setH] = useState(100), [lock, setLock] = useState(true), [mode, setMode] = useState('fit');
            const [bright, setBr] = useState(0.8), [contrast, setCt] = useState(1.0), [inv, setInv] = useState(false);
            const [baseT, setBt] = useState(0.8), [maxT, setMt] = useState(3.0), [res, setRes] = useState(120), [geom, setGeom] = useState('flat');
            const [back, setBack] = useState(false), [colors, setColors] = useState(20);
            const sRef = useRef(null), mRef = useRef(null), gRef = useRef(null), api = useRef(null), lRef = useRef(null);

            const handleImg = (file) => {
                if (!file) return; const i = new Image(); i.onload = () => {
                    setImgW(i.width); setImgH(i.height); const r = i.width / i.height; setImgR(r);
                    if (lock) setH(Math.round(W / r));
                    const c = document.createElement('canvas'); c.width = i.width; c.height = i.height;
                    const ctx = c.getContext('2d'); ctx.drawImage(i, 0, 0);
                    setPix(ctx.getImageData(0, 0, i.width, i.height).data); setImgUrl(URL.createObjectURL(file));
                }; i.src = URL.createObjectURL(file);
            };

            const upW = (v) => { setW(v); if (lock) setH(Math.round(v / imgR)); };
            const upH = (v) => { setH(v); if (lock) setW(Math.round(v * imgR)); };

            useEffect(() => {
                if (!pix || !sRef.current) return;
                const s = sRef.current; if (mRef.current) s.remove(mRef.current);
                const g = STLExporter.buildLitho(pix, imgW, imgH, { width: W, height: H, baseT, maxT, bright, contrast, invert: inv, geom, res, numColors: colors, scaleMode: mode });
                const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: back ? 0xFFEFC0 : 0xE8E0D5, vertexColors: !back, roughness: back ? 0.3 : 0.7, metalness: 0.1, emissive: back ? new THREE.Color(0x331100) : new THREE.Color(0), emissiveIntensity: back ? 0.4 : 0 }));
                const b = new THREE.Box3().setFromObject(m); const c = new THREE.Vector3(); b.getCenter(c); m.position.sub(c);
                s.add(m); mRef.current = m; gRef.current = g;
            }, [pix, W, H, mode, baseT, maxT, res, geom, colors, bright, contrast, inv, back]);

            useEffect(() => {
                if (!sRef.current) return;
                if (lRef.current) { sRef.current.remove(lRef.current); lRef.current = null; }
                if (back) {
                    const pl = new THREE.PointLight(0xFFF5E0, 4, 300); pl.position.set(0, 0, -50);
                    sRef.current.add(pl); lRef.current = pl;
                }
            }, [back]);

            return <div className="tool-page"><div className="tool-layout">
                <div className="panel-left">
                    <div className="panel-header"><span className="panel-title">LITHOPHANE SETUP</span></div>
                    <div className="panel-body">
                        <label className={`upload-zone ${imgUrl ? 'has-image' : ''}`}>{imgUrl ? <img src={imgUrl} /> : <><span>📷</span> Upload Image</>}<input type="file" accept="image/*" onChange={e => handleImg(e.target.files[0])} style={{ display: 'none' }} /></label>
                        <div className="section-label">DIMENSIONS (mm)</div>
                        <div className="dimension-inputs">
                            <div><label>Width</label><input type="number" className="dim-input" value={W} onChange={e => upW(parseFloat(e.target.value))} /></div>
                            <div className={`aspect-lock ${lock ? 'active' : ''}`} onClick={() => setLock(!lock)}>🔗</div>
                            <div style={{ textAlign: 'right' }}><label>Height</label><input type="number" className="dim-input" value={H} onChange={e => upH(parseFloat(e.target.value))} /></div>
                        </div>
                        <div style={{ marginTop: 10 }}>
                            <label style={{ fontSize: 10, color: '#94A3B8' }}>SCALING MODE</label>
                            <select className="dim-input" style={{ marginTop: 4, background: '#1E293B', color: 'white' }} value={mode} onChange={e => setMode(e.target.value)}>
                                <option value="fit">Stretch to fit</option><option value="fill">Fill (Crop excess)</option>
                            </select>
                        </div>
                        <div className="section-label">THICKNESS</div>
                        <div className="thickness-grid">
                            <div className="thickness-item"><label>Base (mm)</label><input type="number" step="0.1" style={{ width: '100%', background: 'none', border: 'none', color: 'white' }} value={baseT} onChange={e => setBt(parseFloat(e.target.value))} /></div>
                            <div className="thickness-item"><label>Max (mm)</label><input type="number" step="0.1" style={{ width: '100%', background: 'none', border: 'none', color: 'white' }} value={maxT} onChange={e => setMt(parseFloat(e.target.value))} /></div>
                        </div>
                        <div className="section-label">GEOMETRY</div>
                        <div className="geo-btn-group">{['flat', 'cylindrical', 'curved'].map(v => <button key={v} className={`geo-btn ${geom === v ? 'active' : ''}`} onClick={() => setGeom(v)}>{v}</button>)}</div>
                        <div className="section-label">MESH DETAIL</div>
                        <input type="range" min="60" max="250" step="10" value={res} onChange={e => setRes(parseInt(e.target.value))} />
                        <button className="download-btn" disabled={!pix} style={{ marginTop: 20 }} onClick={() => STLExporter.download(STLExporter.exportBinary(gRef.current), 'litho.stl')}>EXPORT SOLID STL</button>
                    </div>
                </div>
                <div className="canvas-center">
                    <Canvas3D onMount={o => { sRef.current = o.scene; api.current = o; }} hint="3D Preview" info={pix ? `Solid Block: ${W}x${H}mm` : "Waiting for image..."}>
                        <div style={{ position: 'absolute', top: 10, left: '50%', transform: 'translateX(-50%)', display: 'flex', gap: 10 }}>
                            <button className={`v-btn ${back ? 'active' : ''}`} style={{ background: back ? 'var(--accent)' : 'rgba(15,23,42,0.8)', color: back ? 'black' : '#94A3B8', padding: '6px 12px', borderRadius: 20 }} onClick={() => setBack(!back)}>💡 {back ? 'Backlight ON' : 'Backlight OFF'}</button>
                        </div>
                        <div className="view-btns"><button className="v-btn" onClick={() => api.current.reset()}>Reset</button><button className="v-btn" onClick={() => api.current.set(0, 90)}>Top</button><button className="v-btn" onClick={() => api.current.set(0, 0)}>Front</button></div>
                    </Canvas3D>
                </div>
                <div className="panel-right">
                    <div className="panel-header"><span className="panel-title">ADJUSTMENTS</span></div>
                    <div className="panel-body">
                        <div className="section-label">IMAGE FILTER</div>
                        <div className="control-group"><div className="control-label"><span>Brightness</span><span>{bright}</span></div><input type="range" min="0" max="2" step="0.01" value={bright} onChange={e => setBr(parseFloat(e.target.value))} /></div>
                        <div className="control-group"><div className="control-label"><span>Contrast</span><span>{contrast}</span></div><input type="range" min="0" max="3" step="0.01" value={contrast} onChange={e => setCt(parseFloat(e.target.value))} /></div>
                        <div className="toggle-row"><span className="toggle-label">Invert Heights</span><label className="toggle"><input type="checkbox" checked={inv} onChange={e => setInv(e.target.checked)} /><span className="toggle-slider"></span></label></div>
                        <div className="section-label">COLOR / STEPS</div>
