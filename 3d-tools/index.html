<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3Dwork – 3D Creation Tools</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/i18next@23.8.2/dist/umd/i18next.min.js"></script>
    <script src="https://unpkg.com/react-i18next@14.0.5/dist/umd/react-i18next.min.js"></script>

    <!-- Compartidos -->
    <script type="text/babel" src="js/shared/header.js?v=1.0"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/header.css" />

    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Home = () => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, []);
            return (
                <div className="home-container" style={{ padding: '60px 20px', maxWidth: 1200, margin: '0 auto' }}>
                    <div className="home-header" style={{ textAlign: 'center', marginBottom: 60 }}>
                        <h1 style={{ fontSize: '2.5rem', fontWeight: 800, marginBottom: '1rem' }}>Advanced 3Dwork Tools</h1>
                        <p style={{ color: '#94a3b8', fontSize: '1.1rem' }}>Professional utilities for the 3D printing community.</p>
                    </div>
                    <div className="tools-grid">
                        <a href="litho.html" style={{ textDecoration: 'none' }}>
                            <div className="tool-entry-card litho">
                                <div className="tool-badge orange">3D Creation</div>
                                <div className="tool-entry-icon orange">🖼️</div>
                                <div className="tool-entry-info">
                                    <h2>Lithophane Creator</h2>
                                    <p>Generate watertight 3D-printable solid blocks from photos. Features aspect ratio control, scale modes, and curved geometry support.</p>
                                </div>
                                <ul className="tool-feature-list">
                                    <li>Backlight Simulation</li>
                                    <li>Curved & Cylindrical support</li>
                                    <li>Watertight STL Export</li>
                                </ul>
                                <button className="tool-cta orange">Open Tool <i data-lucide="chevron-right"></i></button>
                            </div>
                        </a>

                        <a href="hueforge.html" style={{ textDecoration: 'none' }}>
                            <div className="tool-entry-card hueforge">
                                <div className="tool-badge blue">Filament Painting</div>
                                <div className="tool-entry-icon blue">🎨</div>
                                <div className="tool-entry-info">
                                    <h2>HueForge Creator</h2>
                                    <p>Predict multi-color filament painting effects using Transmission Distance (TD) blending logic. Manage your filament library and preview layers.</p>
                                </div>
                                <ul className="tool-feature-list">
                                    <li>Realistic TD Blending</li>
                                    <li>Filament Library Management</li>
                                    <li>Export Painting Instructions</li>
                                </ul>
                                <button className="tool-cta blue">Open Tool <i data-lucide="chevron-right"></i></button>
                            </div>
                        </a>

                        <a href="apps/clicker/index.html" style={{ textDecoration: 'none' }}>
                            <div className="tool-entry-card clicker">
                                <div className="tool-badge teal">MX Clickers</div>
                                <div className="tool-entry-icon teal">⌨️</div>
                                <div className="tool-entry-info">
                                    <h2>Clicker Factory</h2>
                                    <p>Turn any image or text into a printable 3D clicker with a real mechanical MX switch. Single or multi-clicker plates with collision-aware auto-placement.</p>
                                </div>
                                <ul className="tool-feature-list">
                                    <li>Image or Text Input</li>
                                    <li>Multi-Clicker Plates</li>
                                    <li>Keychain Loop Option</li>
                                </ul>
                                <button className="tool-cta teal">Open Tool <i data-lucide="chevron-right"></i></button>
                            </div>
                        </a>
                    </div>
                </div>
            );
        };

        const App = () => {
            return <main>
                <SharedHeader.Header active="home" />
                <Home />
                <footer style={{ padding: '20px', textAlign: 'center', fontSize: '0.8rem', color: 'var(--text-muted)', borderTop: '1px solid var(--border)' }}>
                    &copy; 2026 3Dwork.io – HueForge logic based on the excellent open-source <a href="https://github.com/vycdev/Kromacut" target="_blank" style={{ color: 'var(--accent)', textDecoration: 'none' }}>Kromacut</a> project.
                </footer>
            </main>;
        };

        function boot() {
            // Esperar a que el script babel del header esté listo
            if (!window.SharedHeader) { setTimeout(boot, 50); return; }
            const i18n = window.i18next, ri = window.ReactI18next;
            if (!i18n || !ri) { setTimeout(boot, 100); return; }
            i18n.use(ri.initReactI18next).init({
                lng: window.SharedHeader.getLang(),
                resources: { en: { translation: {} }, es: { translation: {} } }
            }, () => {
                ReactDOM.createRoot(document.getElementById('root')).render(
                    <ri.I18nextProvider i18n={i18n}><App /></ri.I18nextProvider>
                );
            });
        } boot();
    </script>
</body>
</html>
