<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3Dwork – 3D Creation Tools</title>

    <!-- Sin caché: esta herramienta cambia (orientación de impresión,
         resolución vertical, malla estanca). Si el navegador se queda con
         una versión antigua, la litofanía sale exportada tumbada. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script src="https://unpkg.com/i18next@23.8.2/dist/umd/i18next.min.js"></script>
    <script src="https://unpkg.com/react-i18next@14.0.5/dist/umd/react-i18next.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <!-- Generador de litofanía (lógica + tests en 3d-tools/tests/) -->
    <script src="js/utils/lithoGeometry.js?v=1.0"></script>
    <!-- Motor de HueForge y comprobaciones de malla (tests en 3d-tools/tests/) -->
    <script src="js/utils/meshChecks.js?v=1.0"></script>
    <script src="js/utils/hueForge.js?v=1.0"></script>

    <link rel="stylesheet" href="css/app.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        header {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 1rem 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        #top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            transition: transform 0.3s ease;
        }

        .logo-img {
            height: 42px;
            width: auto;
            object-fit: contain;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 1rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.4rem;
            border-radius: 100px;
            align-items: center;
        }

        .nav-links a {
            color: #94A3B8;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            padding: 0.6rem 1.2rem;
            border-radius: 100px;
            transition: all 0.4s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: white;
            background: rgba(255, 255, 255, 0.1);
        }

        .dropdown {
            position: relative;
        }

        .dropdown-trigger {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(8px);
            background: rgba(15, 23, 42, 0.98);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 0.5rem;
            min-width: 200px;
            display: none;
            list-style: none;
            z-index: 1001;
        }

        .dropdown:hover .dropdown-menu {
            display: block;
        }

        .dropdown-menu a {
            display: block;
            padding: 0.6rem 1rem;
            font-size: 0.85rem;
            border-radius: 8px;
            text-align: left;
        }

        .palette-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(28px, 1fr));
            gap: 4px;
            margin-top: 8px;
        }

        .palette-swatch {
            aspect-ratio: 1;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .dimension-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            position: relative;
        }

        .aspect-lock {
            position: absolute;
            left: 50%;
            top: 60%;
            transform: translate(-50%, -50%);
            z-index: 5;
            background: #0F172A;
            border: 1px solid var(--border);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            cursor: pointer;
        }

        .aspect-lock.active {
            border-color: var(--accent);
            color: var(--accent);
        }

        .view-btns {
            position: absolute;
            bottom: 10px;
            right: 10px;
            display: flex;
            gap: 6px;
        }

        .v-btn {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            color: #94A3B8;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            cursor: pointer;
        }

        .v-btn:hover {
            color: white;
            border-color: var(--accent);
        }

        .f-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1E293B;
            border: 1px solid var(--border);
            padding: 6px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 6px;
        }

        .f-item:hover {
            border-color: var(--accent);
        }

        .f-col {
            width: 24px;
            height: 24px;
            border-radius: 4px;
        }

        .f-details {
            flex: 1;
            font-size: 11px;
        }

        .f-td {
            font-size: 10px;
            color: var(--accent);
            font-weight: 700;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useId, useCallback } = React;

        /**
         * ========================================================================
         * 1. 3D ENGINES (STL & SHADERS)
         * ========================================================================
         */
        const STLExporter = {
            download: (buf, name) => {
                const bl = new Blob([buf], { type: 'application/octet-stream' });
                const u = URL.createObjectURL(bl);
                const a = document.createElement('a'); a.href = u; a.download = name; a.click();
                setTimeout(() => URL.revokeObjectURL(u), 1000);
            },
            exportBinary: (geo) => {
                if (!geo) return null;
                const pos = geo.getAttribute('position'); const count = pos.count / 3;
                const b = new ArrayBuffer(84 + count * 50); const v = new DataView(b);
                const h = "3Dwork.io Export"; for (let i = 0; i < 80; i++) v.setUint8(i, i < h.length ? h.charCodeAt(i) : 0); v.setUint32(80, count, true);
                const vA = new THREE.Vector3(), vB = new THREE.Vector3(), vC = new THREE.Vector3(), cb = new THREE.Vector3(), ab = new THREE.Vector3();
                let off = 84;
                for (let i = 0; i < count; i++) {
                    vA.fromBufferAttribute(pos, i * 3); vB.fromBufferAttribute(pos, i * 3 + 1); vC.fromBufferAttribute(pos, i * 3 + 2);
                    cb.subVectors(vC, vB); ab.subVectors(vA, vB); cb.cross(ab).normalize();
                    v.setFloat32(off, cb.x, true); v.setFloat32(off + 4, cb.y, true); v.setFloat32(off + 8, cb.z, true);
                    v.setFloat32(off + 12, vA.x, true); v.setFloat32(off + 16, vA.y, true); v.setFloat32(off + 20, vA.z, true);
                    v.setFloat32(off + 24, vB.x, true); v.setFloat32(off + 28, vB.y, true); v.setFloat32(off + 32, vB.z, true);
                    v.setFloat32(off + 36, vC.x, true); v.setFloat32(off + 40, vC.y, true); v.setFloat32(off + 44, vC.z, true);
                    v.setUint16(off + 48, 0, true); off += 50;
                }
                return b;
            },
            // La geometría vive en js/utils/lithoGeometry.js (tiene tests:
            // estanqueidad de la malla, orientación, marco y cuantización).
            buildLitho: (pix, imgW, imgH, S) => {
                const built = window.LithoGeometry.build(pix, imgW, imgH, {
                    width: S.width, height: S.height, baseT: S.baseT, maxT: S.maxT,
                    bright: S.bright, contrast: S.contrast, invert: S.invert,
                    gamma: S.gamma, smoothing: S.smoothing, mirror: S.mirror,
                    res: S.res, layerHeight: S.layerHeight, geom: S.geom,
                    curveAngle: S.curveAngle, border: S.border,
                    scaleMode: S.scaleMode, upright: S.upright
                });
                const geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.BufferAttribute(built.positions, 3));
                // Color por nivel de grosor: simula how much light passes
                const cols = new Float32Array(built.positions.length);
                for (let i = 0, v = 0; i < built.positions.length; i += 3, v++) {
                    // Panel de filamento blanco: lo más grueso queda un poco
                    // más apagado (absorbe más), el relieve lo da la luz.
                    const c = 1.0 - built.levels[v] * 0.38;
                    cols[i] = c; cols[i + 1] = c; cols[i + 2] = c;
                }
                geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
                geo.computeVertexNormals();
                geo.userData = { stats: built.stats, levels: built.levels };
                return geo;
            }
        };

        /**
         * ========================================================================
         * 2. UI COMPONENTS & APP
         * ========================================================================
         */
        const Canvas3D = ({ onMount, hint, info, children, initialView }) => {
            const mount = useRef(null);
            const state = useRef(initialView || { theta: 45, phi: 65, radius: 200 });

            useEffect(() => {
                const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(mount.current.clientWidth, mount.current.clientHeight);
                r.localClippingEnabled = true;   // vista por capas de HueForge
                r.outputColorSpace = THREE.SRGBColorSpace; mount.current.appendChild(r.domElement);
                const s = new THREE.Scene(); s.background = new THREE.Color(0x080E1A);
                const c = new THREE.PerspectiveCamera(45, mount.current.clientWidth / mount.current.clientHeight, 1, 1000);
                // Luces a escala milimétrica: con la caída cuadrática por
                // defecto (decay 2) una luz a 150 mm queda a cero y el modelo
                // sale plano y oscuro. decay 0 = intensidad constante.
                s.add(new THREE.AmbientLight(0xffffff, 0.5));
                const pl = new THREE.PointLight(0xffffff, 1.05, 0, 0); pl.position.set(140, 160, 220); s.add(pl);
                const fill = new THREE.PointLight(0xC8DCFF, 0.4, 0, 0); fill.position.set(-200, -120, 140); s.add(fill);

                const update = () => {
                    const t = state.current.theta * (Math.PI / 180), p = Math.max(5, Math.min(175, state.current.phi)) * (Math.PI / 180);
                    c.position.set(state.current.radius * Math.sin(p) * Math.sin(t), state.current.radius * Math.cos(p), state.current.radius * Math.sin(p) * Math.cos(t));
                    c.lookAt(0, 0, 0);
                }; update();

                let drag = false, px, py;
                r.domElement.onmousedown = (e) => { drag = true; px = e.clientX; py = e.clientY; };
                window.onmouseup = () => drag = false;
                window.onmousemove = (e) => { if (drag) { state.current.theta -= (e.clientX - px) * 0.4; state.current.phi -= (e.clientY - py) * 0.4; px = e.clientX; py = e.clientY; update(); } };
                r.domElement.onwheel = (e) => { e.preventDefault(); state.current.radius = Math.max(40, Math.min(800, state.current.radius + e.deltaY * 0.4)); update(); };

                const anim = () => { state.current.id = requestAnimationFrame(anim); r.render(s, c); }; anim();
                if (onMount) onMount({ scene: s, reset: () => { state.current.theta = 45; state.current.phi = 65; state.current.radius = 200; update(); }, set: (t, p) => { state.current.theta = t; state.current.phi = p; update(); } });
                return () => { cancelAnimationFrame(state.current.id); r.dispose(); mount.current.removeChild(r.domElement); };
            }, []);

            return <div style={{ width: '100%', height: '100%', position: 'relative' }}>
                <div ref={mount} style={{ width: '100%', height: '100%' }} />
                {info && <div className="canvas-overlay" style={{ pointerEvents: 'none' }}><div className="canvas-info" dangerouslySetInnerHTML={{ __html: info }} /></div>}
                {hint && <div className="canvas-hint">{hint}</div>}
                {children}
            </div>;
        };

        const LithophaneTool = () => {
            useEffect(() => { document.title = 'Lithophane Creator – 3Dwork'; }, []);
            const [imgUrl, setImgUrl] = useState(null), [pix, setPix] = useState(null), [imgW, setImgW] = useState(0), [imgH, setImgH] = useState(0), [imgR, setImgR] = useState(1);
            const [W, setW] = useState(100), [H, setH] = useState(100), [lock, setLock] = useState(true), [mode, setMode] = useState('fit');
            const [bright, setBr] = useState(0.8), [contrast, setCt] = useState(1.0), [gamma, setGm] = useState(1.0), [smooth, setSm] = useState(0);
            const [inv, setInv] = useState(false), [mirror, setMir] = useState(false);
            const [baseT, setBt] = useState(0.8), [maxT, setMt] = useState(3.0), [lh, setLh] = useState(0.12), [border, setBd] = useState(0);
            const [res, setRes] = useState(120), [geom, setGeom] = useState('flat'), [angle, setAng] = useState(180);
            const [upright, setUp] = useState(true);
            const [back, setBack] = useState(false);
            const [stats, setStats] = useState(null);
            const sRef = useRef(null), mRef = useRef(null), gRef = useRef(null), api = useRef(null), lRef = useRef(null);

            const handleImg = (file) => {
                if (!file) return; const i = new Image(); i.onload = () => {
                    setImgW(i.width); setImgH(i.height); const r = i.width / i.height; setImgR(r);
                    if (lock) setH(Math.round(W / r));
                    const c = document.createElement('canvas'); c.width = i.width; c.height = i.height;
                    const ctx = c.getContext('2d'); ctx.drawImage(i, 0, 0);
                    setPix(ctx.getImageData(0, 0, i.width, i.height).data); setImgUrl(URL.createObjectURL(file));
                }; i.src = URL.createObjectURL(file);
            };

            const upW = (v) => { setW(v); if (lock) setH(Math.round(v / imgR)); };
            const upH = (v) => { setH(v); if (lock) setW(Math.round(v * imgR)); };

            useEffect(() => {
                if (!pix || !sRef.current) return;
                const s = sRef.current; if (mRef.current) s.remove(mRef.current);
                const g = STLExporter.buildLitho(pix, imgW, imgH, {
                    width: W, height: H, baseT, maxT, bright, contrast, invert: inv,
                    gamma, smoothing: smooth, mirror, res, layerHeight: lh, geom,
                    curveAngle: angle, border, scaleMode: mode, upright
                });
                // Retroiluminación: lo fino deja pasar la luz, lo grueso la tapa.
                // El color de cada vértice pasa a ser "luz transmitida".
                if (back) {
                    const cols = g.getAttribute('color');
                    const lv = (g.userData && g.userData.levels) || [];
                    for (let i = 0, v = 0; i < cols.count; i++, v++) {
                        const thru = 1 - (lv[v] || 0);
                        const warm = 0.22 + thru * 0.78;
                        cols.setXYZ(i, warm, warm * 0.90, warm * 0.68);
                    }
                    cols.needsUpdate = true;
                }
                // En retroiluminación el material no se ilumina: el color de
                // cada vértice ES la luz que atraviesa el panel (lo fino
                // brilla, lo grueso tapa). Con un emisivo uniforme el detalle
                // se perdía.
                const m = back
                    ? new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide }))
                    : new THREE.Mesh(g, new THREE.MeshStandardMaterial({
                        color: 0xffffff, vertexColors: true,
                        roughness: 0.72, metalness: 0.05
                    }));
                // El modelo de pie tiene la altura en Z (eje de la cama). Para
                // verlo como se va a imprimir (de pie, con el alto hacia
                // arriba) se gira la malla en el preview: la imagen queda
                // vertical en pantalla y el grosor mira hacia el espectador.
                if (upright) m.rotation.x = -Math.PI / 2;
                const b = new THREE.Box3().setFromObject(m); const c = new THREE.Vector3(); b.getCenter(c); m.position.sub(c);
                s.add(m); mRef.current = m; gRef.current = g;
                setStats(g.userData && g.userData.stats ? g.userData.stats : null);
            }, [pix, W, H, mode, baseT, maxT, res, geom, bright, contrast, inv, back, gamma, smooth, mirror, lh, angle, border, upright]);

            useEffect(() => {
                if (!sRef.current) return;
                if (lRef.current) { sRef.current.remove(lRef.current); lRef.current = null; }
                if (back) {
                    // La luz va DETRÁS del panel: de pie el panel está en el
                    // plano XZ (la luz viene de -Y); tumbado, en XY (de -Z).
                    // decay 0 para que la luz no se apague con la distancia.
                    const pl = new THREE.PointLight(0xFFF0D0, 1.6, 0, 0);
                    pl.position.set(0, upright ? -70 : 0, upright ? 0 : -70);
                    sRef.current.add(pl); lRef.current = pl;
                }
            }, [back, upright]);

            return <div className="tool-page"><div className="tool-layout">
                <div className="panel-left">
                    <div className="panel-header"><span className="panel-title">LITHOPHANE SETUP</span></div>
                    <div className="panel-body">
                        <label className={`upload-zone ${imgUrl ? 'has-image' : ''}`}>{imgUrl ? <img src={imgUrl} /> : <><span>📷</span> Upload Image</>}<input type="file" accept="image/*" onChange={e => handleImg(e.target.files[0])} style={{ display: 'none' }} /></label>
                        <div className="section-label">DIMENSIONS (mm)</div>
                        <div className="dimension-inputs">
                            <div><label>Width</label><input type="number" className="dim-input" value={W} onChange={e => upW(parseFloat(e.target.value))} /></div>
                            <div className={`aspect-lock ${lock ? 'active' : ''}`} onClick={() => setLock(!lock)}>🔗</div>
                            <div style={{ textAlign: 'right' }}><label>Height</label><input type="number" className="dim-input" value={H} onChange={e => upH(parseFloat(e.target.value))} /></div>
                        </div>
                        <div style={{ marginTop: 10 }}>
                            <label style={{ fontSize: 10, color: '#94A3B8' }}>SCALING MODE</label>
                            <select className="dim-input" style={{ marginTop: 4, background: '#1E293B', color: 'white' }} value={mode} onChange={e => setMode(e.target.value)}>
                                <option value="fit">Stretch to fit</option><option value="fill">Fill (Crop excess)</option>
                            </select>
                        </div>
                        <div className="section-label">THICKNESS</div>
                        <div className="thickness-grid">
                            <div className="thickness-item"><label>Base (mm)</label><input type="number" step="0.1" style={{ width: '100%', background: 'none', border: 'none', color: 'white' }} value={baseT} onChange={e => setBt(parseFloat(e.target.value))} /></div>
                            <div className="thickness-item"><label>Max (mm)</label><input type="number" step="0.1" style={{ width: '100%', background: 'none', border: 'none', color: 'white' }} value={maxT} onChange={e => setMt(parseFloat(e.target.value))} /></div>
                        </div>
                        <div className="section-label">PRINT SETTINGS</div>
                        <div className="control-group">
                            <div className="control-label"><span>Orientation</span><span>{upright ? 'Upright' : 'Flat on bed'}</span></div>
                            <div className="geo-btn-group" style={{ display: 'flex', gap: '6px' }}>
                                <button className={`geo-btn ${upright ? 'active' : ''}`} style={{ flex: 1 }} onClick={() => setUp(true)}>Upright</button>
                                <button className={`geo-btn ${!upright ? 'active' : ''}`} style={{ flex: 1 }} onClick={() => setUp(false)}>Flat</button>
                            </div>
                            <p style={{ fontSize: 9, color: '#94A3B8', marginTop: '4px', lineHeight: 1.4 }}>
                                Upright puts the image in the vertical plane: each layer captures a horizontal line of the photo. Flat prints as a relief on the bed and blurs the detail.
                            </p>
                        </div>
                        <div className="thickness-grid">
                            <div className="thickness-item"><label>Layer Height (mm)</label><input type="number" step="0.01" min="0.04" style={{ width: '100%', background: 'none', border: 'none', color: 'white' }} value={lh} onChange={e => setLh(parseFloat(e.target.value))} /></div>
                            <div className="thickness-item"><label>Border (mm)</label><input type="number" step="0.5" min="0" style={{ width: '100%', background: 'none', border: 'none', color: 'white' }} value={border} onChange={e => setBd(Math.max(0, parseFloat(e.target.value) || 0))} /></div>
                        </div>
                        <div className="section-label">GEOMETRY</div>
                        <div className="geo-btn-group">{['flat', 'cylindrical', 'curved'].map(v => <button key={v} className={`geo-btn ${geom === v ? 'active' : ''}`} onClick={() => { setGeom(v); setAng(v === 'curved' ? 90 : 180); }}>{v}</button>)}</div>
                        {geom !== 'flat' && (
                            <div className="control-group" style={{ marginTop: '8px' }}>
                                <div className="control-label"><span>Curve Angle</span><span>{angle}°</span></div>
                                <input type="range" min="60" max="360" step="15" value={angle} onChange={e => setAng(parseInt(e.target.value))} />
                            </div>
                        )}
                        <div className="section-label">MESH DETAIL</div>
                        <input type="range" min="60" max="250" step="10" value={res} onChange={e => setRes(parseInt(e.target.value))} />
                        <p style={{ fontSize: 9, color: '#94A3B8', marginTop: '4px' }}>
                            Horizontal detail: {res} px. Vertical detail follows the layer height: {stats ? stats.resY : '…'} rows.
                        </p>
                        <button className="download-btn" disabled={!pix} style={{ marginTop: 20 }} onClick={() => STLExporter.download(STLExporter.exportBinary(gRef.current), '3dwork_lithophane.stl')}>EXPORT SOLID STL</button>
                    </div>
                </div>
                <div className="canvas-center">
                    <Canvas3D onMount={o => { sRef.current = o.scene; api.current = o; }} initialView={{ theta: 32, phi: 72, radius: 250 }} hint="3D Preview" info={pix ? `Solid Block: ${W}x${H}mm` : "Waiting for image..."}>
                        <div style={{ position: 'absolute', top: 10, left: '50%', transform: 'translateX(-50%)', display: 'flex', gap: 10 }}>
                            <button className={`v-btn ${back ? 'active' : ''}`} style={{ background: back ? 'var(--accent)' : 'rgba(15,23,42,0.8)', color: back ? 'black' : '#94A3B8', padding: '6px 12px', borderRadius: 20 }} onClick={() => setBack(!back)}>💡 {back ? 'Backlight ON' : 'Backlight OFF'}</button>
                        </div>
                        <div className="view-btns">
                            <button className="v-btn" onClick={() => api.current.reset()}>Reset</button>
                            <button className="v-btn" onClick={() => api.current.set(0, 10)}>Top</button>
                            <button className="v-btn" onClick={() => api.current.set(0, 85)}>Front</button>
                        </div>
                    </Canvas3D>
                </div>
                <div className="panel-right">
                    <div className="panel-header"><span className="panel-title">ADJUSTMENTS</span></div>
                    <div className="panel-body">

                        <div className="section-label">IMAGE FILTERS</div>
                        <div className="control-group"><div className="control-label"><span>Exposure</span><span>{bright}</span></div><input type="range" min="0" max="2" step="0.01" value={bright} onChange={e => setBr(parseFloat(e.target.value))} /></div>

                        <div className="thickness-grid">
                            <div className="thickness-item"><label>Black Point</label><input type="range" min="0" max="1" step="0.01" value={blackP} onChange={e => setBp(parseFloat(e.target.value))} /></div>
                            <div className="thickness-item"><label>White Point</label><input type="range" min="0" max="1" step="0.01" value={whiteP} onChange={e => setWp(parseFloat(e.target.value))} /></div>

                                <label>Layer Height (mm)</label>

                        <p style={{ fontSize: 9, color: '#94A3B8', marginTop: '4px' }}>

                    </div>
                </div>
                <div className="canvas-center">

                    </Canvas3D>
                    {relief && mode === 'layered' && (
                        <div style={{ position: 'absolute', left: 12, right: 12, bottom: 12, background: 'rgba(8,14,26,0.85)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: 12, padding: '10px 12px' }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                                <span style={{ fontSize: 9, color: '#94A3B8', whiteSpace: 'nowrap' }}>{view === 'layers' ? 'CUT' : 'LAYER'}</span>
                                <input type="range" min="0" max={maxZ} step={lh} value={view === 'layers' ? clip : inspect} onChange={e => { const v = parseFloat(e.target.value); if (view === 'layers') setClip(v); else setInspect(v); }} style={{ flex: 1 }} />
                                <span style={{ fontSize: 9, fontFamily: 'var(--mono)', color: 'white', minWidth: '52px', textAlign: 'right' }}>{(view === 'layers' ? clip : inspect).toFixed(2)} mm</span>
                                {view === 'sim' && <div style={{ width: 16, height: 16, borderRadius: 3, background: css(inspectColor), border: '1px solid rgba(255,255,255,0.3)' }} />}
                                {view === 'sim' && <span style={{ fontSize: 9, color: '#94A3B8', minWidth: '70px' }}>{inspectLayer ? inspectLayer.name : 'base'}</span>}
                            </div>
                            {view === 'layers' && (

                </div>
                <div className="panel-right">
                    <div className="panel-header" style={{ padding: 0, borderBottom: 'none' }}>
                        <div style={{ display: 'flex', width: '100%' }}>
                            <button className={`nav-tab ${tab === 'stack' ? 'active' : ''}`} style={{ borderBottom: 'none', borderRadius: 0, flex: 1, fontSize: 10 }} onClick={() => setTab('stack')}>LAYER STACK</button>
                            <button className={`nav-tab ${tab === 'library' ? 'active' : ''}`} style={{ borderBottom: 'none', borderRadius: 0, flex: 1, fontSize: 10 }} onClick={() => setTab('library')}>FILAMENTS</button>
                            <button className={`nav-tab ${tab === 'calib' ? 'active' : ''}`} style={{ borderBottom: 'none', borderRadius: 0, flex: 1, fontSize: 10 }} onClick={() => setTab('calib')}>CALIBRATE</button>
                            <button className={`nav-tab ${tab === 'help' ? 'active' : ''}`} style={{ borderBottom: 'none', borderRadius: 0, flex: 1, fontSize: 10 }} onClick={() => setTab('help')}>HOW IT WORKS</button>
                        </div>
                    </div>
                    {tab === 'stack' ? (
                        <div className="panel-body">
                            {mode === 'layered' && (
                                <>
                                    <div className="thickness-grid">
                                        <div className="thickness-item"><label>Base Depth</label><input type="number" step="0.01" min="0" style={{ width: '100%', background: 'none', border: 'none', color: 'white' }} value={baseT} onChange={e => setBt(Math.max(0, parseFloat(e.target.value) || 0))} /></div>
                                        <div className="thickness-item"><label>Relief Height</label><input type="number" step="0.01" min="0" style={{ width: '100%', background: 'none', border: 'none', color: 'white' }} value={relT} onChange={e => setRt(Math.max(0, parseFloat(e.target.value) || 0))} /></div>
                                    </div>
                                    <div className="thickness-grid" style={{ marginTop: '6px' }}>
                                        <div className="thickness-item"><label>Max Height</label><input type="number" step="0.01" min="0" style={{ width: '100%', background: 'none', border: 'none', color: 'white' }} value={maxH} onChange={e => setMaxH(Math.max(0, parseFloat(e.target.value) || 0))} /></div>
                                        <div className="thickness-item"><label>Layers</label><div style={{ fontSize: 11, color: 'var(--accent)', fontWeight: 700, paddingTop: 4 }}>{Math.round(maxZ / lh)}</div></div>
                                    </div>
                                    {tdWarning.length > 0 && (
                                        <div style={{ fontSize: 9, color: '#f59e0b', marginTop: '8px', lineHeight: 1.5 }}>
                                            ⚠ {tdWarning.join(', ')} necesita más altura de la que tiene la pieza (TD mayor que el alto total): el color se verá más apagado de lo simulado.
                                        </div>
                                    )}
                                    <div style={{ display: 'flex', gap: 10, alignItems: 'center', margin: '10px 0' }}>
                                        <button className="download-btn" style={{ flex: 1, padding: 8, fontSize: 10, background: 'rgba(255,255,255,0.05)', color: 'var(--accent)', boxShadow: 'none', border: '1px solid var(--border-accent)' }} onClick={autoStack}>⚡ AUTO-CALC STACK</button>
                                        <label className="toggle-row" style={{ fontSize: 9, gap: 5, cursor: 'pointer' }} onClick={() => setAutoSort(!autoSort)}>
                                            Sort <div className={`aspect-lock ${autoSort ? 'active' : ''}`} style={{ width: 20, height: 20, fontSize: 10 }}>A</div>
                                        </label>
                                    </div>
                                </>
                            )}

                            <div className="layer-list" style={{ marginTop: 0 }}>
                                {layers.map((l, i) => (
                                    <div key={l.id} className="f-item" style={{ borderLeft: `6px solid ${l.hex}`, background: 'rgba(255,255,255,0.03)' }}>
                                        <div className="f-details">
                                            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 4 }}>
                                                <div style={{ display: 'flex', gap: 5, alignItems: 'center' }}>
                                                    <input type="color" value={l.hex} onChange={e => {
                                                        const nl = [...layers]; nl[i].hex = e.target.value; setLayers(nl);
                                                    }} style={{ width: 20, height: 20, border: 'none', padding: 0, background: 'none', cursor: 'pointer' }} />
                                                    <b>{l.name}</b>
                                                    {l.brand ? <span style={{ fontSize: 8, color: '#64748B' }}>{l.brand}</span> : null}
                                                </div>
                                                <div style={{ display: 'flex', gap: 2 }}>
                                                    {mode === 'layered' && <button className="canvas-ctrl-btn" style={{ width: 18, height: 18 }} onClick={() => moveLayer(i, -1)}>↑</button>}
                                                    {mode === 'layered' && <button className="canvas-ctrl-btn" style={{ width: 18, height: 18 }} onClick={() => moveLayer(i, 1)}>↓</button>}

                                            </div>

                                                <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                                                    <span style={{ fontSize: 9 }}>{mode === 'layered' ? 'Swap at: ' + l.stop.toFixed(2) + 'mm' : 'Color'}</span>

                                                        const nl = [...layers]; nl[i].td = parseFloat(e.target.value); setLayers(nl);
                                                    }} style={{ width: 30, background: 'none', border: 'none', color: 'var(--accent)', fontSize: 9 }} /></div>
                                                </div>
                                                {mode === 'layered' && (
                                                    <input type="range" min="0" max={maxZ} step={lh} value={l.stop} onChange={e => {
                                                        const nl = [...layers]; nl[i].stop = parseFloat(e.target.value); setLayers(nl);
                                                    }} />
                                                )}
                                            </div>
                                        </div>
                                        <button onClick={() => removeFilament(i)}>×</button>
                                    </div>
                                ))}
                            </div>

                            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 6, marginTop: 16 }}>
                                <button className="download-btn" style={{ background: 'rgba(59,130,246,0.1)', color: '#93C5FD', margin: 0, fontSize: 10, border: '1px solid rgba(59,130,246,0.3)' }} disabled={!imgUrl} onClick={exportGuide}>GUIDE</button>
                                <button className="download-btn" style={{ background: 'rgba(168,85,247,0.12)', color: '#C4B5FD', margin: 0, fontSize: 10, border: '1px solid rgba(168,85,247,0.35)' }} disabled={!imgUrl || mode === 'flat'} onClick={exportGcode}>M600 GCODE</button>
                                <button className="download-btn" style={{ background: 'var(--accent)', color: 'black', margin: 0, fontSize: 10 }} disabled={!imgUrl} onClick={export3MF}>PROJECT 3MF</button>
                            </div>
                            <p style={{ fontSize: 9, color: '#64748B', marginTop: 6, lineHeight: 1.5 }}>

                                    ? 'El 3MF lleva un objeto por color con su extrusor: es un multicolor (AMS), no un cambio por capas.'

                    ) : tab === 'library' ? (

                            <div className="filament-list" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 5, maxHeight: '58vh', overflowY: 'auto' }}>

                                            <div>{f.colorName}</div>

                                ))}
                            </div>
                            <p style={{ fontSize: 9, color: '#64748B', marginTop: 8, lineHeight: 1.5 }}>
                                TD = distancia de ocultación: los milímetros que tarda el filamento en dejar pasar la luz. Con más TD hace falta más altura para que el color se imponga.
                            </p>
                        </div>
                    ) : tab === 'calib' ? (
                        <div className="panel-body">
                            <div className="section-label">CALIBRATE TD</div>
                            <p style={{ fontSize: 10, color: '#94A3B8', lineHeight: 1.55, marginBottom: 10 }}>
                                1. Imprime la carta (una fila de muestras por filamento, de 0,2 a 2,4 mm, más dos referencias negra y blanca).
                                <br />2. Hazle una foto con luz uniforme.
                                <br />3. Sube la foto: se mide el TD de cada filamento.
                            </p>
                            <button className="download-btn" style={{ background: 'rgba(34,197,94,0.12)', color: '#86efac', margin: 0, fontSize: 10, border: '1px solid rgba(34,197,94,0.35)' }} disabled={!layers.length} onClick={exportChart}>⬇ CHART STL</button>
                            <label className={`upload-zone ${calibPix ? 'has-image' : ''}`} style={{ marginTop: 10, padding: '0.6rem', display: 'block' }}>

                            </label>
                            {calibMsg && <p style={{ fontSize: 9, color: calibResult && calibResult.ok ? '#86efac' : '#f59e0b', marginTop: 8 }}>{calibMsg}</p>}
                            {calibResult && calibResult.ok && (
                                <>
                                    <div className="section-label" style={{ marginTop: 10 }}>MEASURED TD</div>
                                    {calibResult.results.map((r, i) => (
                                        <div key={i} className="f-item" style={{ margin: 0, fontSize: 10, padding: 6, borderLeft: `6px solid ${r.hex}` }}>
                                            <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                                                <b>{r.name}</b>
                                                <span style={{ color: 'var(--accent)', fontWeight: 700 }}>
                                                    {r.td ? r.td.toFixed(2) + ' mm' : '—'}
                                                </span>
                                            </div>
                                            {r.r2 !== undefined && r.r2 !== null && (
                                                <div style={{ fontSize: 8, color: '#64748B' }}>ajuste R² = {r.r2.toFixed(3)}</div>
                                            )}
                                        </div>
                                    ))}
                                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 6, marginTop: 10 }}>
                                        <button className="download-btn" style={{ background: 'rgba(255,255,255,0.05)', color: 'var(--accent)', margin: 0, fontSize: 10, border: '1px solid var(--border-accent)' }} onClick={() => applyTd(calibResult.results)}>APPLY TO PALETTE</button>
                                        <button className="download-btn" style={{ background: 'rgba(255,255,255,0.05)', color: 'var(--accent)', margin: 0, fontSize: 10, border: '1px solid var(--border-accent)' }} onClick={saveProfile}>SAVE PROFILE</button>
                                    </div>
                                    <p style={{ fontSize: 9, color: '#64748B', marginTop: 8, lineHeight: 1.5 }}>
                                        El TD es la profundidad a la que el filamento deja pasar el 10 % de la luz. Conociéndolo, el apilado automático reparte la altura entre los colores de forma proporcionada.
                                    </p>
                                </>
                            )}
                        </div>
                    ) : (
                        <div className="panel-body help-box" style={{ fontSize: 11, lineHeight: 1.6, color: 'var(--text-dim)', overflowY: 'auto' }}>
                            <h4 style={{ color: 'white', marginBottom: 10 }}>How it works (step by step)</h4>
                            <ol style={{ paddingLeft: 15, display: 'flex', flexDirection: 'column', gap: 10 }}>
                                <li><b>Elige los filamentos</b> — En FILAMENTS tienes la biblioteca con su TD real. En CALIBRATE puedes medir el TD de los tuyos con una foto.</li>
                                <li><b>Dos modos</b> — <b>Layered</b>: el color se consigue con el relieve (un filamento por altura, cambio con M600). <b>Flat Paint</b>: pieza plana y el color lo pone el filamento (multicolor/AMS).</li>
                                <li><b>Orden de impresión</b> — Por defecto se ordenan de oscuro a claro: el inferior hace de fondo y el superior aporta la luz.</li>
                                <li><b>Apilado automático</b> — <b>⚡ AUTO-CALC STACK</b> reparte la altura de forma proporcional al TD de cada filamento. Si no cabe, se escala todo por el mismo factor.</li>
                                <li><b>Relieve cuantizado</b> — Las alturas se redondean a múltiplos de la altura de capa: lo que ves es lo que imprime la máquina.</li>
                                <li><b>Vista por capas</b> — Con <b>LAYERS 3D</b> ves la pila real y puedes mover el <b>CUT</b> para ver el interior y las bandas de filamento.</li>
                                <li><b>Mezcla Beer-Lambert</b> — Cada capa transmite el 10 % de la luz por cada TD de profundidad; el color final es la composición de todas las capas por debajo.</li>
                            </ol>
                            <div style={{ marginTop: 20, padding: 10, borderRadius: 8, background: 'rgba(255,120,0,0.05)', border: '1px solid var(--border-accent)' }}>
                                <p style={{ color: 'var(--accent)', fontWeight: 700, marginBottom: 5 }}>Pro Tip:</p>
                                Mide tu TD con la carta de CALIBRATE: con el valor real el apilado automático reparte la altura como toca y los colores salen justos.
                            </div>
                            <div style={{ marginTop: 12, padding: 10, borderRadius: 8, background: 'rgba(59,130,246,0.05)', border: '1px solid rgba(59,130,246,0.2)' }}>
                                <p style={{ color: '#93C5FD', fontWeight: 700, marginBottom: 5 }}>Para imprimir bien:</p>
                                Relleno 100 %, sin espiral (spiral vase), sin soportes, altura de capa 0,08–0,16 mm y pausas M600 con la purga de cada filamento.
                            </div>
                        </div>
                    )}
                </div>
            </div></div>;
        };

        const App = () => {
            const [v, setV] = useState('home');

            useEffect(() => {
                const handleHash = () => {
                    const hash = window.location.hash;
                    if (hash === '#litho') setV('litho');
                    else if (hash === '#hue') setV('hue');
                    else if (hash === '' || hash === '#home') setV('home');
                };
                handleHash();
                window.addEventListener('hashchange', handleHash);
                if (window.lucide) window.lucide.createIcons();
                return () => window.removeEventListener('hashchange', handleHash);
            }, []);

            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [v]);

            const setView = (view) => {
                const hash = view === 'home' ? '#home' : (view === 'litho' ? '#litho' : '#hue');
                window.location.hash = hash;
                setV(view);
            };

            return <main>
                <header>
