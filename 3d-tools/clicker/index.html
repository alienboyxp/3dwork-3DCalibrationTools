<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clicker Factory — 3Dwork</title>
    <!-- Favicon: 3Dwork branding -->
    <link rel="icon" type="image/png" href="./assets/favicon/3dworkfaviconblack.png" />
    <link rel="icon" type="image/png" href="./assets/favicon/3dworkfaviconblack.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="./assets/favicon/3dworkfaviconblack.png" />
    <script>
      (function() {
        const saved = localStorage.getItem('clicker_theme');
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = saved || (systemDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        // Soporte para integración externa (WordPress, etc.):
        //   ?noheader=1  -> oculta las barras laterales, deja solo el visor 3D
        const params = new URLSearchParams(window.location.search);
        if (params.get('noheader') === '1') {
          const style = document.createElement('style');
          style.textContent = '#sidebar-left, #sidebar-right { display: none !important; } #viewport { grid-column: 1 / -1; }';
          document.head.appendChild(style);
        }
      })();
    </script>
  </head>
  <body>
    <div id="layout">
      <aside id="sidebar-left" class="sidebar left"></aside>
      <div id="viewport">
        <div id="app"></div>
        <div id="status">Booting…</div>
      </div>
      <aside id="sidebar-right" class="sidebar right"></aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
