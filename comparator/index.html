<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparador de Impresoras 3D — 3Dwork</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8B5CF6;
            --primary-light: #A78BFA;
            --primary-dark: #6D28D9;
            --secondary: #10B981;
            --bg-dark: #0F172A;
            --bg-card: rgba(30, 41, 59, 0.7);
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --accent-glow: rgba(139, 92, 246, 0.5);
            --font-family: 'Outfit', 'Inter', system-ui, -apple-system, sans-serif;
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
        body {
            background-color: var(--bg-dark);
            background-image:
                radial-gradient(circle at 0% 0%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(16, 185, 129, 0.1) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: var(--font-family);
            line-height: 1.6;
            min-height: 100vh;
        }
        #app { width: 100%; }
    </style>
</head>
<body>
    <div id="app"></div>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="../src/components/comparator.js?v=2.0"></script>
    <script>
        window.currentLang = (navigator.language || 'es').startsWith('es') ? 'es' : 'en';
        document.documentElement.lang = window.currentLang;
        document.addEventListener('DOMContentLoaded', function() {
            var container = document.getElementById('app');
            window.renderComparator(container, {}, { dataUrl: '../src/assets/printers.json' });
        });
    </script>
</body>
</html>
